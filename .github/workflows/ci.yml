name: Docker API tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t api-test:${{ github.sha }} .

      - name: Run API test in container
        run: docker run --rm api-test:${{ github.sha }}
